<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Dashboard - COLLAB Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            color: #1e3c72;
            font-size: 36px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .controls-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(42, 82, 152, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(235, 51, 73, 0.4);
        }

        .btn-download {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .stat-card h3 {
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: #1e3c72;
        }

        .personnel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .personnel-card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: all 0.3s;
            position: relative;
        }

        .personnel-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .personnel-card input[type="checkbox"] {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 26px;
            height: 26px;
            cursor: pointer;
            accent-color: #2a5298;
        }

        .personnel-name {
            font-size: 22px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 18px;
            padding-right: 50px;
        }

        .personnel-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 18px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 17px;
            font-weight: 700;
            color: #333;
        }

        .salary-highlight {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            margin-top: 18px;
        }

        .salary-highlight .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .salary-highlight .amount {
            font-size: 28px;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        /* CA Deduction Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 35px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 25px 70px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            color: #1e3c72;
            font-size: 24px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            color: #999;
            line-height: 1;
            padding: 0;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .employee-select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .employee-select:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
        }

        .deduction-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .deduction-input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
        }

        .preview-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px solid #e0e0e0;
        }

        .preview-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .preview-row.total {
            font-weight: 700;
            font-size: 18px;
            color: #1e3c72;
            padding-top: 12px;
            border-top: 2px solid #2a5298;
            margin-top: 12px;
        }

        /* Print Styles */
        .print-container {
            display: none;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .dashboard-container,
            .header,
            .controls,
            .stats-grid,
            .personnel-grid,
            .modal {
                display: none !important;
            }

            .print-container {
                display: block !important;
            }

            @page {
                size: A4 landscape;
                margin: 8mm;
            }

            .payslip-page {
                page-break-after: always;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 6mm;
                width: 100%;
                height: 100vh;
            }

            .payslip-page:last-child {
                page-break-after: auto;
            }

            .payslip {
                background: white;
                padding: 4mm;
                width: 100%;
                height: 100%;
                border: 1.5px solid #000;
                font-family: 'Courier New', monospace;
                font-size: 7.5px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .payslip-header {
                text-align: center;
                border-bottom: 1.5px solid #000;
                padding-bottom: 2mm;
                margin-bottom: 2mm;
            }

            .payslip-header h1 {
                font-size: 10px;
                margin-bottom: 1mm;
                font-weight: bold;
                letter-spacing: 1px;
            }

            .payslip-header p {
                font-size: 7px;
                margin: 0.5mm 0;
                line-height: 1.3;
            }

            .payslip-period {
                text-align: center;
                font-size: 8px;
                margin-bottom: 2mm;
                font-weight: bold;
                text-decoration: underline;
            }

            .payslip-employee-info {
                display: flex;
                justify-content: space-between;
                margin-bottom: 2mm;
                font-size: 7.5px;
                font-weight: bold;
            }

            .attendance-table {
                width: 100%;
                border-collapse: collapse;
                margin: 2mm 0;
                font-size: 6.5px;
            }

            .attendance-table th,
            .attendance-table td {
                border: 0.75px solid #000;
                padding: 1mm 0.5mm;
                text-align: center;
                vertical-align: middle;
            }

            .attendance-table th:first-child,
            .attendance-table td:first-child {
                text-align: left;
                padding-left: 2mm;
                font-size: 7px;
                max-width: 40mm;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .attendance-table th {
                background: #f0f0f0;
                font-weight: bold;
            }

            .attendance-table .header-row th {
                font-size: 6.5px;
                padding: 1mm 0.5mm;
            }

            .attendance-table .time-cell {
                font-size: 6px;
                line-height: 1.3;
            }

            .earnings-section {
                margin-top: 2mm;
                font-size: 7px;
            }

            .earnings-row {
                display: flex;
                justify-content: space-between;
                padding: 1mm 0;
                border-bottom: 0.5px solid #ddd;
            }

            .earnings-row.formula {
                font-size: 6.5px;
                color: #333;
            }

            .earnings-row.total {
                border-top: 1.5px solid #000;
                border-bottom: 1.5px solid #000;
                font-weight: bold;
                margin-top: 2mm;
                padding: 1.5mm 0;
                font-size: 8px;
            }

            .deductions-section {
                margin-top: 2mm;
                font-size: 7px;
            }

            .deductions-title {
                font-weight: bold;
                text-decoration: underline;
                margin-bottom: 1mm;
                font-size: 7.5px;
            }
        }

        .payslip {
            background: white;
            padding: 20px;
            max-width: 100%;
            margin: 0 auto 30px;
            border: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 9px;
        }

        .payslip-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .payslip-header h1 {
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .payslip-header p {
            font-size: 10px;
            margin: 3px 0;
        }

        .payslip-period {
            text-align: center;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            text-decoration: underline;
        }

        .payslip-employee-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 11px;
            font-weight: bold;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 9px;
        }

        .attendance-table th,
        .attendance-table td {
            border: 1px solid #000;
            padding: 6px 4px;
            text-align: center;
            vertical-align: middle;
        }

        .attendance-table th:first-child,
        .attendance-table td:first-child {
            text-align: left;
            padding-left: 8px;
            min-width: 120px;
        }

        .attendance-table th {
            background: #f0f0f0;
            font-weight: bold;
        }

        .attendance-table .header-row th {
            font-size: 9px;
            padding: 6px 4px;
        }

        .attendance-table .time-cell {
            font-size: 8px;
            line-height: 1.3;
        }

        .earnings-section {
            margin-top: 20px;
            font-size: 11px;
        }

        .earnings-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #ddd;
        }

        .earnings-row.total {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px 0;
            font-size: 12px;
        }

        .deductions-section {
            margin-top: 15px;
            font-size: 11px;
        }

        .deductions-title {
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .personnel-grid {
                grid-template-columns: 1fr;
            }

            .controls-row {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .header h1 {
                font-size: 28px;
            }

            .logout-btn {
                position: static;
                width: 100%;
                margin-top: 15px;
            }
        }

        .no-data {
            text-align: center;
            padding: 80px;
            background: white;
            border-radius: 20px;
            color: #999;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .no-data svg {
            width: 120px;
            height: 120px;
            margin-bottom: 25px;
            opacity: 0.5;
        }

        .no-data h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<!-- Dashboard -->
    <div class="dashboard-container" id="dashboardContainer">
        <div class="header">
            <h1>📊 Payroll Dashboard</h1>
            <p>COLLAB Attendance System - Weekly Payroll Management</p>
        </div>

        <div class="controls">
            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search employee name...">
                </div>
                <button class="btn btn-primary" onclick="selectAll()">
                    ✓ Select All
                </button>
                <button class="btn btn-success" onclick="deselectAll()">
                    ✗ Deselect All
                </button>
                <button class="btn btn-danger" onclick="openCAModal()">
                    💰 CA Deductions
                </button>
                <button class="btn btn-download" onclick="downloadPayslips()">
                    📥 Download PDF
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <div class="value" id="totalEmployees">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Hours</h3>
                <div class="value" id="totalHours">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Payroll</h3>
                <div class="value" id="totalPayroll">₱0</div>
            </div>
            <div class="stat-card">
                <h3>Selected</h3>
                <div class="value" id="selectedCount">0</div>
            </div>
        </div>

        <div id="personnelGrid" class="personnel-grid">
            <div class="loading">Loading payroll data...</div>
        </div>
    </div>

    <!-- CA Deduction Modal -->
    <div class="modal" id="caModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💰 CA Deduction</h2>
                <button class="close-btn" onclick="closeCAModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Select Employee</label>
                <select class="employee-select" id="caEmployeeSelect" onchange="updateCAPreview()">
                    <option value="">-- Choose Employee --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Deduction Amount (₱)</label>
                <input type="number" class="deduction-input" id="caAmount" placeholder="0.00" step="0.01" min="0" oninput="updateCAPreview()">
            </div>
            <div class="preview-box" id="caPreview" style="display: none;">
                <div class="preview-row">
                    <span>Original Salary:</span>
                    <span id="originalSalary">₱0.00</span>
                </div>
                <div class="preview-row">
                    <span>CA Deduction:</span>
                    <span id="deductionAmount">₱0.00</span>
                </div>
                <div class="preview-row total">
                    <span>Net Pay:</span>
                    <span id="netPay">₱0.00</span>
                </div>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="applyCADeduction()">Apply Deduction</button>
        </div>
    </div>

    <!-- Print Container -->
    <div class="print-container" id="printContainer"></div>

    <script>
        // ================================================================================
        // ⚠️ CONFIGURATION - UPDATE THIS URL
        // ================================================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLcwgET-iub61ptEjhkjQ9tr1C8K3DKnH4_2csxF4FSZg5rdb726hyIReDymuS7iKG/exec";
        
        let allEmployees = [];
        let filteredEmployees = [];
        let caDeductions = {}; // Store CA deductions by employee name

        // Initialize dashboard on page load
        window.addEventListener('DOMContentLoaded', () => {
            initDashboard();
        });

        // Initialize dashboard
        async function initDashboard() {
            try {
                const grid = document.getElementById('personnelGrid');
                grid.innerHTML = '<div class="loading">Loading payroll data from Google Sheets...</div>';
                
                const response = await fetch(APPS_SCRIPT_URL + '?action=getPayrollData', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    
                    if (result.success && result.data && result.data.length > 0) {
                        allEmployees = result.data;
                        filteredEmployees = [...allEmployees];
                        renderEmployees();
                        updateStats();
                        populateCAEmployeeSelect();
                    } else {
                        throw new Error('No payroll data found');
                    }
                } else {
                    throw new Error('Failed to fetch data');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load data. Using sample data.');
                loadSampleData();
            }
        }

        // Load sample data
        function loadSampleData() {
            allEmployees = [
                {
                    name: "Ray An Rubio",
                    perDayRate: 666.67,
                    perHourRate: 83.33375,
                    overtimeRate: 108.33387,
                    workingHours: 40.00,
                    workingDays: 5,
                    overtimeHours: 2.50,
                    regularSalary: 3500.00,
                    overtimeFee: 270.83,
                    finalSalary: 3770.83,
                    weekStart: "2026-08-11",
                    weekEnd: "2026-08-17"
                }
            ];
            filteredEmployees = [...allEmployees];
            renderEmployees();
            updateStats();
            populateCAEmployeeSelect();
        }

        // Show error
        function showError(message) {
            const grid = document.getElementById('personnelGrid');
            grid.innerHTML = `
                <div class="no-data">
                    <h3>⚠️ Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Render employees
        function renderEmployees() {
            const grid = document.getElementById('personnelGrid');
            
            if (filteredEmployees.length === 0) {
                grid.innerHTML = `
                    <div class="no-data">
                        <h3>No employees found</h3>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredEmployees.map((emp, index) => {
                const netSalary = emp.finalSalary - (caDeductions[emp.name] || 0);
                return `
                    <div class="personnel-card">
                        <input type="checkbox" class="employee-checkbox" data-index="${index}" onchange="updateSelectionCount()">
                        <div class="personnel-name">${emp.name}</div>
                        <div class="personnel-info">
                            <div class="info-item">
                                <span class="info-label">Working Days</span>
                                <span class="info-value">${emp.workingDays || 0} days</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Working Hours</span>
                                <span class="info-value">${(emp.workingHours || 0).toFixed(2)} hrs</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Overtime Hours</span>
                                <span class="info-value">${(emp.overtimeHours || 0).toFixed(2)} hrs</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Per Day Rate</span>
                                <span class="info-value">₱${(emp.perDayRate || 0).toFixed(2)}</span>
                            </div>
                        </div>
                        ${caDeductions[emp.name] ? `
                        <div style="background: #fff3cd; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px;">
                            <strong>CA Deduction: ₱${caDeductions[emp.name].toFixed(2)}</strong>
                        </div>
                        ` : ''}
                        <div class="salary-highlight">
                            <div class="label">${caDeductions[emp.name] ? 'Net Pay' : 'Weekly Salary'}</div>
                            <div class="amount">₱${netSalary.toLocaleString('en-PH', {minimumFractionDigits: 2})}</div>
                        </div>
                        ${getStatusBadge(emp)}
                    </div>
                `;
            }).join('');
        }

        // Get status badge
        function getStatusBadge(emp) {
            if (emp.workingDays >= 5) {
                return '<span class="badge badge-success">✓ Full Week</span>';
            } else if (emp.workingDays >= 3) {
                return '<span class="badge badge-warning">⚠ Partial Week</span>';
            } else {
                return '<span class="badge badge-danger">✗ Incomplete</span>';
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalEmployees').textContent = allEmployees.length;
            
            const totalHours = allEmployees.reduce((sum, emp) => sum + (emp.workingHours || 0), 0);
            document.getElementById('totalHours').textContent = totalHours.toFixed(2);
            
            const totalPayroll = allEmployees.reduce((sum, emp) => {
                const netSalary = emp.finalSalary - (caDeductions[emp.name] || 0);
                return sum + netSalary;
            }, 0);
            document.getElementById('totalPayroll').textContent = '₱' + totalPayroll.toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            updateSelectionCount();
        }

        // Update selection count
        function updateSelectionCount() {
            const selected = document.querySelectorAll('.employee-checkbox:checked').length;
            document.getElementById('selectedCount').textContent = selected;
        }

        // Select all
        function selectAll() {
            document.querySelectorAll('.employee-checkbox').forEach(cb => cb.checked = true);
            updateSelectionCount();
        }

        // Deselect all
        function deselectAll() {
            document.querySelectorAll('.employee-checkbox').forEach(cb => cb.checked = false);
            updateSelectionCount();
        }

        // Search functionality
        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredEmployees = allEmployees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm)
            );
            renderEmployees();
        });

        // CA Modal functions
        function openCAModal() {
            document.getElementById('caModal').style.display = 'flex';
        }

        function closeCAModal() {
            document.getElementById('caModal').style.display = 'none';
            document.getElementById('caEmployeeSelect').value = '';
            document.getElementById('caAmount').value = '';
            document.getElementById('caPreview').style.display = 'none';
        }

        function populateCAEmployeeSelect() {
            const select = document.getElementById('caEmployeeSelect');
            select.innerHTML = '<option value="">-- Choose Employee --</option>';
            
            allEmployees.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.name;
                option.textContent = emp.name;
                select.appendChild(option);
            });
        }

        function updateCAPreview() {
            const employeeName = document.getElementById('caEmployeeSelect').value;
            const amount = parseFloat(document.getElementById('caAmount').value) || 0;
            
            if (!employeeName || amount <= 0) {
                document.getElementById('caPreview').style.display = 'none';
                return;
            }
            
            const employee = allEmployees.find(emp => emp.name === employeeName);
            if (!employee) return;
            
            const originalSalary = employee.finalSalary;
            const netPay = originalSalary - amount;
            
            document.getElementById('originalSalary').textContent = '₱' + originalSalary.toFixed(2);
            document.getElementById('deductionAmount').textContent = '₱' + amount.toFixed(2);
            document.getElementById('netPay').textContent = '₱' + netPay.toFixed(2);
            document.getElementById('caPreview').style.display = 'block';
        }

        function applyCADeduction() {
            const employeeName = document.getElementById('caEmployeeSelect').value;
            const amount = parseFloat(document.getElementById('caAmount').value) || 0;
            
            if (!employeeName) {
                alert('Please select an employee');
                return;
            }
            
            if (amount <= 0) {
                alert('Please enter a valid deduction amount');
                return;
            }
            
            const employee = allEmployees.find(emp => emp.name === employeeName);
            if (amount > employee.finalSalary) {
                alert('Deduction amount cannot exceed the employee salary!');
                return;
            }
            
            caDeductions[employeeName] = amount;
            renderEmployees();
            updateStats();
            closeCAModal();
            
            alert(`CA Deduction of ₱${amount.toFixed(2)} applied to ${employeeName}`);
        }

        // Download payslips
        async function downloadPayslips() {
            const checkboxes = document.querySelectorAll('.employee-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('Please select at least one employee');
                return;
            }

            const printContainer = document.getElementById('printContainer');
            printContainer.innerHTML = '<div class="loading" style="color: #333;">Generating payslips...</div>';

            try {
                const payslipsHtml = [];
                const selectedEmployees = [];
                
                for (const checkbox of checkboxes) {
                    const index = parseInt(checkbox.dataset.index);
                    const employee = filteredEmployees[index];
                    
                    try {
                        const response = await fetch(APPS_SCRIPT_URL + '?action=getEmployeeAttendanceDetails&name=' + encodeURIComponent(employee.name), {
                            method: 'GET',
                            mode: 'cors'
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            if (result.success) {
                                employee.dailyRecords = result.dailyRecords;
                            }
                        }
                    } catch (error) {
                        console.error('Error fetching attendance:', error);
                    }
                    
                    selectedEmployees.push(employee);
                }
                
                // Group payslips into pages of 4 (2x2 grid)
                let pageHtml = '';
                for (let i = 0; i < selectedEmployees.length; i += 4) {
                    const pageEmployees = selectedEmployees.slice(i, i + 4);
                    const payslipsInPage = pageEmployees.map(emp => generatePayslip(emp)).join('');
                    pageHtml += `<div class="payslip-page">${payslipsInPage}</div>`;
                }
                
                printContainer.innerHTML = pageHtml;
                setTimeout(() => window.print(), 500);
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error generating payslips');
                printContainer.innerHTML = '';
            }
        }

        // Generate payslip
        function generatePayslip(emp) {
            const formatDate = (dateStr) => {
                if (!dateStr) return 'N/A';
                const d = new Date(dateStr);
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[d.getMonth()] + '-' + d.getDate();
            };
            
            const weekDates = emp.dates || getWeekDates(emp.weekStart);
            const dailyRecords = emp.dailyRecords || [];
            
            // Shorten name if too long
            let displayName = emp.name;
            if (displayName.length > 25) {
                displayName = displayName.substring(0, 23) + '..';
            }
            
            let attendanceRows = '';
            if (dailyRecords.length > 0) {
                attendanceRows = `
                    <tr>
                        <td style="text-align: left; font-weight: bold; padding-left: 2mm;">${displayName}</td>
                        ${dailyRecords.map((day, idx) => {
                            if (day.clockIn === '-' && day.clockOut === '-') {
                                return '<td class="time-cell">-<br/>-</td>';
                            }
                            return `<td class="time-cell">${day.clockIn || '-'}<br/>${day.clockOut || '-'}</td>`;
                        }).join('')}
                        <td style="font-weight: bold;">${emp.workingDays || 0}d</td>
                    </tr>
                `;
            } else {
                attendanceRows = `
                    <tr>
                        <td style="text-align: left; font-weight: bold; padding-left: 2mm;">${displayName}</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td style="font-weight: bold;">${emp.workingDays || 0}d</td>
                    </tr>
                `;
            }
            
            const caDeduction = caDeductions[emp.name] || 0;
            const grossPay = emp.finalSalary;
            const netPay = grossPay - caDeduction;
            
            return `
                <div class="payslip">
                    <div class="payslip-header">
                        <h1>COLLAB PRINTING AND GRAPHIC DESIGN</h1>
                        <p>377 Manggahan St. Crossing Bayabas Toril Davao City</p>
                        <p>${emp.weekStart || 'N/A'} to ${emp.weekEnd || 'N/A'}</p>
                    </div>

                    <div class="payslip-period">WEEKLY PAYSLIP</div>

                    <div class="payslip-employee-info">
                        <div>${displayName}</div>
                        <div>${emp.weekStart || 'N/A'}</div>
                    </div>

                    <table class="attendance-table">
                        <thead>
                            <tr class="header-row">
                                <th style="text-align: left; padding-left: 2mm;">Name</th>
                                <th>MON<br/><span class="time-cell">${formatDate(weekDates[0])}</span></th>
                                <th>TUE<br/><span class="time-cell">${formatDate(weekDates[1])}</span></th>
                                <th>WED<br/><span class="time-cell">${formatDate(weekDates[2])}</span></th>
                                <th>THU<br/><span class="time-cell">${formatDate(weekDates[3])}</span></th>
                                <th>FRI<br/><span class="time-cell">${formatDate(weekDates[4])}</span></th>
                                <th>SAT<br/><span class="time-cell">${formatDate(weekDates[5])}</span></th>
                                <th>SUN<br/><span class="time-cell">${formatDate(weekDates[6])}</span></th>
                                <th>TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${attendanceRows}
                        </tbody>
                    </table>

                    <div class="earnings-section">
                        <div class="earnings-row">
                            <span>Working Days:</span>
                            <span>${emp.workingDays || 0}</span>
                        </div>
                        <div class="earnings-row">
                            <span>Daily Rate:</span>
                            <span>₱${(emp.perDayRate || 0).toFixed(2)}</span>
                        </div>
                        <div class="earnings-row formula">
                            <span>${emp.workingDays || 0} days × ₱${(emp.perDayRate || 0).toFixed(2)}</span>
                            <span>₱${(emp.regularSalary || 0).toFixed(2)}</span>
                        </div>
                        <div class="earnings-row">
                            <span>OT (${(emp.overtimeHours || 0).toFixed(2)} hrs × ₱${(emp.overtimeRate || 0).toFixed(2)}):</span>
                            <span>₱${(emp.overtimeFee || 0).toFixed(2)}</span>
                        </div>
                        <div class="earnings-row total">
                            <span>GROSS PAY:</span>
                            <span>₱${grossPay.toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="deductions-section">
                        <div class="deductions-title">DEDUCTIONS:</div>
                        <div class="earnings-row">
                            <span>CA Deduction:</span>
                            <span>₱${caDeduction.toFixed(2)}</span>
                        </div>
                        <div class="earnings-row formula">
                            <span>₱${grossPay.toFixed(2)} - ₱${caDeduction.toFixed(2)}</span>
                            <span></span>
                        </div>
                        <div class="earnings-row total">
                            <span>NET PAY:</span>
                            <span>₱${netPay.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function getWeekDates(weekStart) {
            if (!weekStart) return [];
            
            const dates = [];
            const startDate = new Date(weekStart);
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                dates.push(date.toISOString().split('T')[0]);
            }
            
            return dates;
        }
    </script>
</body>
</html>
