<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Dashboard - COLLAB Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --gray: #64748b;
            --gray-light: #f1f5f9;
            --white: #ffffff;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 16px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
        }

        /* Container */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: var(--white);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header h1 {
            color: var(--dark);
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .header p {
            color: var(--gray);
            font-size: 14px;
            margin: 4px 0 0 0;
        }

        /* Controls */
        .controls {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: all 0.3s ease;
            background: var(--gray-light);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: var(--shadow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: var(--white);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--secondary) 0%, #db2777 100%);
            color: var(--white);
        }

        .btn-download {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: var(--white);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        }

        .stat-card h3 {
            color: var(--gray);
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-top: 12px;
            opacity: 0.1;
            position: absolute;
            right: 24px;
            top: 24px;
        }

        /* Personnel Grid */
        .personnel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .personnel-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }

        .personnel-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .personnel-card input[type="checkbox"] {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .personnel-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 16px;
            padding-right: 40px;
        }

        .personnel-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 11px;
            color: var(--gray);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
        }

        .salary-highlight {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 16px;
            border-radius: var(--radius-sm);
            text-align: center;
            margin-top: 16px;
        }

        .salary-highlight .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .salary-highlight .amount {
            font-size: 24px;
            font-weight: 700;
        }

        .ca-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fed7aa;
            color: #92400e;
        }

        .badge-danger {
            background: #fecaca;
            color: #991b1b;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            padding: 20px;
        }

        .modal-content {
            background: var(--white);
            padding: 32px;
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            box-shadow: var(--shadow-lg);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--gray-light);
        }

        .modal-header h2 {
            color: var(--dark);
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            background: var(--gray-light);
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray);
            line-height: 1;
            padding: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--danger);
            color: var(--white);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 600;
            font-size: 14px;
        }

        .employee-select,
        .deduction-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: all 0.3s ease;
            background: var(--gray-light);
        }

        .employee-select:focus,
        .deduction-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .preview-box {
            background: var(--gray-light);
            padding: 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            border: 2px solid #e2e8f0;
        }

        .preview-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .preview-row.total {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
            padding-top: 12px;
            border-top: 2px solid var(--primary);
            margin-top: 12px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--white);
            font-size: 18px;
            font-weight: 600;
        }

        .no-data {
            text-align: center;
            padding: 80px 40px;
            background: var(--white);
            border-radius: var(--radius);
            color: var(--gray);
            box-shadow: var(--shadow);
        }

        .no-data h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--dark);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                padding: 12px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls {
                padding: 16px;
            }

            .controls-row {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
                min-width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .personnel-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 24px;
            }
        }

        @media (max-width: 480px) {
            .header-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .stat-card .value {
                font-size: 28px;
            }

            .personnel-name {
                font-size: 16px;
            }
        }

        /* Print Styles */
        .print-container {
            display: none;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .dashboard-container,
            .header,
            .controls,
            .stats-grid,
            .personnel-grid,
            .modal {
                display: none !important;
            }

            .print-container {
                display: block !important;
            }

            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            .payslip-page {
                page-break-after: always;
                display: flex;
                flex-direction: column;
                gap: 8mm;
                width: 100%;
                height: 100vh;
            }

            .payslip-page:last-child {
                page-break-after: auto;
            }

            .payslip {
                background: white;
                padding: 5mm;
                width: 100%;
                flex: 1;
                border: 2px solid #000;
                font-family: 'Courier New', monospace;
                font-size: 8.5px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
            }

            .payslip-header {
                text-align: center;
                border-bottom: 2px solid #000;
                padding-bottom: 2mm;
                margin-bottom: 2mm;
            }

            .payslip-header h1 {
                font-size: 12px;
                margin-bottom: 1mm;
                font-weight: bold;
                letter-spacing: 1.5px;
            }

            .payslip-header p {
                font-size: 8px;
                margin: 0.5mm 0;
                line-height: 1.4;
            }

            .payslip-period {
                text-align: center;
                font-size: 9px;
                margin-bottom: 2mm;
                font-weight: bold;
                text-decoration: underline;
            }

            .payslip-employee-info {
                display: flex;
                justify-content: space-between;
                margin-bottom: 2mm;
                font-size: 8.5px;
                font-weight: bold;
            }

            .attendance-table {
                width: 100%;
                border-collapse: collapse;
                margin: 2mm 0;
                font-size: 7.5px;
            }

            .attendance-table th,
            .attendance-table td {
                border: 1px solid #000;
                padding: 1.5mm 0.5mm;
                text-align: center;
                vertical-align: middle;
            }

            .attendance-table th:first-child,
            .attendance-table td:first-child {
                text-align: left;
                padding-left: 2mm;
                font-size: 8px;
                min-width: 50mm;
            }

            .attendance-table th {
                background: #f0f0f0;
                font-weight: bold;
            }

            .attendance-table .header-row th {
                font-size: 7.5px;
                padding: 1.5mm 0.5mm;
            }

            .attendance-table .time-cell {
                font-size: 7px;
                line-height: 1.4;
            }

            .earnings-section {
                margin-top: 2mm;
                font-size: 8px;
            }

            .earnings-row {
                display: flex;
                justify-content: space-between;
                padding: 1mm 0;
                border-bottom: 0.75px solid #ddd;
            }

            .earnings-row.formula {
                font-size: 7.5px;
                color: #333;
            }

            .earnings-row.total {
                border-top: 2px solid #000;
                border-bottom: 2px solid #000;
                font-weight: bold;
                margin-top: 2mm;
                padding: 2mm 0;
                font-size: 9px;
            }

            .deductions-section {
                margin-top: 2mm;
                font-size: 8px;
            }

            .deductions-title {
                font-weight: bold;
                text-decoration: underline;
                margin-bottom: 1mm;
                font-size: 8.5px;
            }
        }

        .payslip {
            background: white;
            padding: 20px;
            max-width: 100%;
            margin: 0 auto 30px;
            border: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 9px;
        }

        /* Button loading state */
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-loading {
            position: relative;
        }

        .btn-loading::after {
            content: '...';
            position: absolute;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .payslip-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .payslip-header h1 {
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .payslip-header p {
            font-size: 10px;
            margin: 3px 0;
        }

        .payslip-period {
            text-align: center;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            text-decoration: underline;
        }

        .payslip-employee-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 11px;
            font-weight: bold;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 9px;
        }

        .attendance-table th,
        .attendance-table td {
            border: 1px solid #000;
            padding: 6px 4px;
            text-align: center;
            vertical-align: middle;
        }

        .attendance-table th:first-child,
        .attendance-table td:first-child {
            text-align: left;
            padding-left: 8px;
            min-width: 120px;
        }

        .attendance-table th {
            background: #f0f0f0;
            font-weight: bold;
        }

        .attendance-table .header-row th {
            font-size: 9px;
            padding: 6px 4px;
        }

        .attendance-table .time-cell {
            font-size: 8px;
            line-height: 1.3;
        }

        .earnings-section {
            margin-top: 20px;
            font-size: 11px;
        }

        .earnings-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #ddd;
        }

        .earnings-row.total {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px 0;
            font-size: 12px;
        }

        .deductions-section {
            margin-top: 15px;
            font-size: 11px;
        }

        .deductions-title {
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .personnel-grid {
                grid-template-columns: 1fr;
            }

            .controls-row {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .header h1 {
                font-size: 28px;
            }

            .logout-btn {
                position: static;
                width: 100%;
                margin-top: 15px;
            }
        }

        .no-data {
            text-align: center;
            padding: 80px;
            background: white;
            border-radius: 20px;
            color: #999;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .no-data svg {
            width: 120px;
            height: 120px;
            margin-bottom: 25px;
            opacity: 0.5;
        }

        .no-data h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<!-- Dashboard -->
    <div class="dashboard-container" id="dashboardContainer">
        <div class="header">
            <h1>📊 Payroll Dashboard</h1>
            <p>COLLAB Attendance System - Weekly Payroll Management</p>
        </div>

        <div class="controls">
            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search employee name...">
                </div>
                <button class="btn btn-primary" onclick="selectAll()">
                    ✓ Select All
                </button>
                <button class="btn btn-success" onclick="deselectAll()">
                    ✗ Deselect All
                </button>
                <button class="btn btn-danger" onclick="openCAModal()">
                    💰 CA Deductions
                </button>
                <button class="btn btn-download" onclick="downloadPayslips()">
                    📥 Download PDF
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <div class="value" id="totalEmployees">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Hours</h3>
                <div class="value" id="totalHours">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Payroll</h3>
                <div class="value" id="totalPayroll">₱0</div>
            </div>
            <div class="stat-card">
                <h3>Selected</h3>
                <div class="value" id="selectedCount">0</div>
            </div>
        </div>

        <div id="personnelGrid" class="personnel-grid">
            <div class="loading">Loading payroll data...</div>
        </div>
    </div>

    <!-- CA Deduction Modal -->
    <div class="modal" id="caModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💰 CA Deduction</h2>
                <button class="close-btn" onclick="closeCAModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Select Employee</label>
                <select class="employee-select" id="caEmployeeSelect" onchange="updateCAPreview()">
                    <option value="">-- Choose Employee --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Deduction Amount (₱)</label>
                <input type="number" class="deduction-input" id="caAmount" placeholder="0.00" step="0.01" min="0" oninput="updateCAPreview()">
            </div>
            <div class="preview-box" id="caPreview" style="display: none;">
                <div class="preview-row">
                    <span>Original Salary:</span>
                    <span id="originalSalary">₱0.00</span>
                </div>
                <div class="preview-row">
                    <span>CA Deduction:</span>
                    <span id="deductionAmount">₱0.00</span>
                </div>
                <div class="preview-row total">
                    <span>Net Pay:</span>
                    <span id="netPay">₱0.00</span>
                </div>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="applyCADeduction()">Apply Deduction</button>
        </div>
    </div>

    <!-- Print Container -->
    <div class="print-container" id="printContainer"></div>

    <script>
        // ================================================================================
        // ⚠️ CONFIGURATION - UPDATE THIS URL
        // ================================================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLcwgET-iub61ptEjhkjQ9tr1C8K3DKnH4_2csxF4FSZg5rdb726hyIReDymuS7iKG/exec";
        
        let allEmployees = [];
        let filteredEmployees = [];
        let caDeductions = {}; // Store CA deductions by employee name

        // Initialize dashboard on page load
        window.addEventListener('DOMContentLoaded', () => {
            initDashboard();
        });

        // Initialize dashboard
        async function initDashboard() {
            try {
                const grid = document.getElementById('personnelGrid');
                grid.innerHTML = '<div class="loading">Loading payroll data from Google Sheets...</div>';
                
                const response = await fetch(APPS_SCRIPT_URL + '?action=getPayrollData', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    
                    if (result.success && result.data && result.data.length > 0) {
                        allEmployees = result.data;
                        filteredEmployees = [...allEmployees];
                        renderEmployees();
                        updateStats();
                        populateCAEmployeeSelect();
                    } else {
                        throw new Error('No payroll data found');
                    }
                } else {
                    throw new Error('Failed to fetch data');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load data. Using sample data.');
                loadSampleData();
            }
        }

        // Load sample data
        function loadSampleData() {
            allEmployees = [
                {
                    name: "Ray An Rubio",
                    perDayRate: 666.67,
                    perHourRate: 83.33375,
                    overtimeRate: 108.33387,
                    workingHours: 40.00,
                    workingDays: 5,
                    overtimeHours: 2.50,
                    regularSalary: 3500.00,
                    overtimeFee: 270.83,
                    finalSalary: 3770.83,
                    weekStart: "2026-08-11",
                    weekEnd: "2026-08-17"
                }
            ];
            filteredEmployees = [...allEmployees];
            renderEmployees();
            updateStats();
            populateCAEmployeeSelect();
        }

        // Show error
        function showError(message) {
            const grid = document.getElementById('personnelGrid');
            grid.innerHTML = `
                <div class="no-data">
                    <h3>⚠️ Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Render employees
        function renderEmployees() {
            const grid = document.getElementById('personnelGrid');
            
            if (filteredEmployees.length === 0) {
                grid.innerHTML = `
                    <div class="no-data">
                        <h3>No employees found</h3>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredEmployees.map((emp, index) => {
                const netSalary = emp.finalSalary - (caDeductions[emp.name] || 0);
                return `
                    <div class="personnel-card">
                        <input type="checkbox" class="employee-checkbox" data-index="${index}" onchange="updateSelectionCount()">
                        <div class="personnel-name">${emp.name}</div>
                        <div class="personnel-info">
                            <div class="info-item">
                                <span class="info-label">Working Days</span>
                                <span class="info-value">${emp.workingDays || 0} days</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Working Hours</span>
                                <span class="info-value">${(emp.workingHours || 0).toFixed(2)} hrs</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Overtime Hours</span>
                                <span class="info-value">${(emp.overtimeHours || 0).toFixed(2)} hrs</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Per Day Rate</span>
                                <span class="info-value">₱${(emp.perDayRate || 0).toFixed(2)}</span>
                            </div>
                        </div>
                        ${caDeductions[emp.name] ? `
                        <div class="ca-badge">
                            CA Deduction: ₱${caDeductions[emp.name].toFixed(2)}
                        </div>
                        ` : ''}
                        <div class="salary-highlight">
                            <div class="label">${caDeductions[emp.name] ? 'Net Pay' : 'Weekly Salary'}</div>
                            <div class="amount">₱${netSalary.toLocaleString('en-PH', {minimumFractionDigits: 2})}</div>
                        </div>
                        ${getStatusBadge(emp)}
                    </div>
                `;
            }).join('');
        }

        // Get status badge
        function getStatusBadge(emp) {
            if (emp.workingDays >= 5) {
                return '<span class="badge badge-success">✓ Full Week</span>';
            } else if (emp.workingDays >= 3) {
                return '<span class="badge badge-warning">⚠ Partial Week</span>';
            } else {
                return '<span class="badge badge-danger">✗ Incomplete</span>';
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalEmployees').textContent = allEmployees.length;
            
            const totalHours = allEmployees.reduce((sum, emp) => sum + (emp.workingHours || 0), 0);
            document.getElementById('totalHours').textContent = totalHours.toFixed(2);
            
            const totalPayroll = allEmployees.reduce((sum, emp) => {
                const netSalary = emp.finalSalary - (caDeductions[emp.name] || 0);
                return sum + netSalary;
            }, 0);
            document.getElementById('totalPayroll').textContent = '₱' + totalPayroll.toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            updateSelectionCount();
        }

        // Update selection count
        function updateSelectionCount() {
            const selected = document.querySelectorAll('.employee-checkbox:checked').length;
            document.getElementById('selectedCount').textContent = selected;
        }

        // Select all
        function selectAll() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Selecting...';
            
            setTimeout(() => {
                document.querySelectorAll('.employee-checkbox').forEach(cb => cb.checked = true);
                updateSelectionCount();
                btn.disabled = false;
                btn.textContent = '✓ Select All';
            }, 100);
        }

        // Deselect all
        function deselectAll() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Deselecting...';
            
            setTimeout(() => {
                document.querySelectorAll('.employee-checkbox').forEach(cb => cb.checked = false);
                updateSelectionCount();
                btn.disabled = false;
                btn.textContent = '✗ Deselect All';
            }, 100);
        }

        // Search functionality
        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredEmployees = allEmployees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm)
            );
            renderEmployees();
        });

        // CA Modal functions
        function openCAModal() {
            document.getElementById('caModal').style.display = 'flex';
        }

        function closeCAModal() {
            document.getElementById('caModal').style.display = 'none';
            document.getElementById('caEmployeeSelect').value = '';
            document.getElementById('caAmount').value = '';
            document.getElementById('caPreview').style.display = 'none';
        }

        function populateCAEmployeeSelect() {
            const select = document.getElementById('caEmployeeSelect');
            select.innerHTML = '<option value="">-- Choose Employee --</option>';
            
            allEmployees.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.name;
                option.textContent = emp.name;
                select.appendChild(option);
            });
        }

        function updateCAPreview() {
            const employeeName = document.getElementById('caEmployeeSelect').value;
            const amount = parseFloat(document.getElementById('caAmount').value) || 0;
            
            if (!employeeName || amount <= 0) {
                document.getElementById('caPreview').style.display = 'none';
                return;
            }
            
            const employee = allEmployees.find(emp => emp.name === employeeName);
            if (!employee) return;
            
            const originalSalary = employee.finalSalary;
            const netPay = originalSalary - amount;
            
            document.getElementById('originalSalary').textContent = '₱' + originalSalary.toFixed(2);
            document.getElementById('deductionAmount').textContent = '₱' + amount.toFixed(2);
            document.getElementById('netPay').textContent = '₱' + netPay.toFixed(2);
            document.getElementById('caPreview').style.display = 'block';
        }

        function applyCADeduction() {
            const employeeName = document.getElementById('caEmployeeSelect').value;
            const amount = parseFloat(document.getElementById('caAmount').value) || 0;
            
            if (!employeeName) {
                alert('Please select an employee');
                return;
            }
            
            if (amount <= 0) {
                alert('Please enter a valid deduction amount');
                return;
            }
            
            const employee = allEmployees.find(emp => emp.name === employeeName);
            if (amount > employee.finalSalary) {
                alert('Deduction amount cannot exceed the employee salary!');
                return;
            }
            
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Applying...';
            
            setTimeout(() => {
                caDeductions[employeeName] = amount;
                renderEmployees();
                updateStats();
                closeCAModal();
                
                btn.disabled = false;
                btn.textContent = 'Apply Deduction';
                
                alert(`✓ CA Deduction of ₱${amount.toFixed(2)} successfully applied to ${employeeName}`);
            }, 300);
        }

        // Download payslips
        async function downloadPayslips() {
            const checkboxes = document.querySelectorAll('.employee-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('Please select at least one employee to generate payslips.');
                return;
            }

            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Generating Payslips...';

            const printContainer = document.getElementById('printContainer');
            printContainer.innerHTML = '<div class="loading" style="color: #333; padding: 20px; text-align: center;"><h3>⏳ Fetching attendance data...</h3><p>Please wait while we retrieve detailed attendance records from Google Sheets.</p></div>';

            try {
                const selectedEmployees = [];
                
                // Fetch attendance data for each selected employee
                for (const checkbox of checkboxes) {
                    const index = parseInt(checkbox.dataset.index);
                    const employee = {...filteredEmployees[index]}; // Clone to avoid mutation
                    
                    try {
                        console.log('Fetching attendance for:', employee.name);
                        const response = await fetch(APPS_SCRIPT_URL + '?action=getEmployeeAttendanceDetails&name=' + encodeURIComponent(employee.name), {
                            method: 'GET',
                            mode: 'cors'
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            console.log('Attendance result for', employee.name, ':', result);
                            console.log('  Success:', result.success);
                            console.log('  Daily records exists:', !!result.dailyRecords);
                            
                            if (result.success && result.dailyRecords) {
                                employee.dailyRecords = result.dailyRecords;
                                console.log('  Daily records set for', employee.name);
                                console.log('  Number of records:', employee.dailyRecords.length);
                                
                                // Log a sample record to verify data structure
                                if (employee.dailyRecords.length > 0) {
                                    console.log('  Sample record [0]:', employee.dailyRecords[0]);
                                }
                            } else {
                                console.warn('  No daily records in response for', employee.name);
                                employee.dailyRecords = [];
                            }
                        } else {
                            console.error('  HTTP error fetching attendance for', employee.name, '- Status:', response.status);
                            employee.dailyRecords = [];
                        }
                    } catch (error) {
                        console.error('Error fetching attendance for ' + employee.name + ':', error);
                        employee.dailyRecords = [];
                    }
                    
                    selectedEmployees.push(employee);
                }
                
                console.log('Total employees with data:', selectedEmployees.length);
                
                // Group payslips into pages of 2 (top and bottom)
                let pageHtml = '';
                for (let i = 0; i < selectedEmployees.length; i += 2) {
                    const pageEmployees = selectedEmployees.slice(i, i + 2);
                    console.log('Generating page', Math.floor(i/2) + 1, 'with', pageEmployees.length, 'employees');
                    
                    const payslipsInPage = pageEmployees.map(emp => {
                        console.log('Generating payslip for:', emp.name, 'Records:', emp.dailyRecords);
                        return generatePayslip(emp);
                    }).join('');
                    
                    pageHtml += `<div class="payslip-page">${payslipsInPage}</div>`;
                }
                
                printContainer.innerHTML = pageHtml;
                console.log('All payslips generated, ready to print');
                
                // Give browser time to render before printing
                setTimeout(() => {
                    window.print();
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }, 800);
                
            } catch (error) {
                console.error('Error generating payslips:', error);
                alert('Error generating payslips: ' + error.message);
                printContainer.innerHTML = '';
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Generate payslip
        function generatePayslip(emp) {
            console.log('=== GENERATING PAYSLIP FOR:', emp.name, '===');
            console.log('Employee object:', emp);
            console.log('Daily records:', emp.dailyRecords);
            
            const formatDate = (dateStr) => {
                if (!dateStr) return 'N/A';
                const d = new Date(dateStr);
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[d.getMonth()] + '-' + d.getDate();
            };
            
            const formatFullDate = (dateStr) => {
                if (!dateStr) return 'N/A';
                const d = new Date(dateStr);
                return d.getFullYear() + '-' + 
                       String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                       String(d.getDate()).padStart(2, '0');
            };
            
            // Calculate hours worked per day
            const calculateDayHours = (day, dayIndex) => {
                console.log('  Calculating hours for day', dayIndex, ':', day);
                
                if (!day || day.clockIn === '-' || day.clockOut === '-' || !day.clockIn || !day.clockOut) {
                    console.log('  -> No data or missing clock times, returning -');
                    return '-';
                }
                
                // Parse time strings - handles multiple formats
                const parseTime = (timeStr) => {
                    if (!timeStr || timeStr === '-') return null;
                    
                    console.log('    Parsing time:', timeStr, 'Type:', typeof timeStr);
                    
                    // Handle if timeStr is a Date object
                    if (timeStr instanceof Date) {
                        const hours = timeStr.getHours();
                        const minutes = timeStr.getMinutes();
                        const result = hours + (minutes / 60);
                        console.log('    Date object parsed to:', result, 'hours');
                        return result;
                    }
                    
                    const cleanTime = timeStr.toString().trim();
                    
                    // Try to parse as 12-hour format with AM/PM
                    const parts = cleanTime.split(' ');
                    if (parts.length === 2) {
                        const timeParts = parts[0].split(':');
                        if (timeParts.length === 2) {
                            let hours = parseInt(timeParts[0]);
                            const minutes = parseInt(timeParts[1]);
                            const period = parts[1].toUpperCase();
                            
                            // Validate parsed values
                            if (!isNaN(hours) && !isNaN(minutes)) {
                                // Convert to 24-hour format
                                if (period === 'PM' && hours !== 12) hours += 12;
                                if (period === 'AM' && hours === 12) hours = 0;
                                
                                const result = hours + (minutes / 60);
                                console.log('    12-hour format parsed to:', result, 'hours');
                                return result;
                            }
                        }
                    }
                    
                    // Try to parse as 24-hour format (HH:MM)
                    const timeParts24 = cleanTime.split(':');
                    if (timeParts24.length === 2) {
                        const hours = parseInt(timeParts24[0]);
                        const minutes = parseInt(timeParts24[1]);
                        
                        if (!isNaN(hours) && !isNaN(minutes)) {
                            const result = hours + (minutes / 60);
                            console.log('    24-hour format parsed to:', result, 'hours');
                            return result;
                        }
                    }
                    
                    console.warn('    Could not parse time format:', timeStr);
                    return null;
                };
                
                const startHours = parseTime(day.clockIn);
                const endHours = parseTime(day.clockOut);
                
                if (startHours === null || endHours === null) {
                    console.warn('  -> Could not parse times for day:', day);
                    return '-';
                }
                
                let workedHours = endHours - startHours;
                if (workedHours < 0) workedHours += 24; // Handle overnight shifts
                
                console.log('  -> Raw worked hours:', workedHours);
                
                // Deduct 1 hour for lunch if worked more than 4 hours and started before noon
                if (workedHours > 4 && startHours < 12) {
                    console.log('  -> Deducting 1 hour for lunch');
                    workedHours -= 1;
                }
                
                // Cap at 8 hours per day
                workedHours = Math.min(workedHours, 8);
                workedHours = Math.max(workedHours, 0); // Don't allow negative
                
                console.log('  -> Final worked hours:', workedHours);
                
                // Return formatted value
                if (workedHours === 0) return '-';
                
                // Format: show 1 decimal place, but if it's a whole number, show it cleanly
                const formatted = workedHours.toFixed(1);
                return formatted.endsWith('.0') ? formatted.slice(0, -2) : formatted;
            };
            
            const weekDates = emp.dates || getWeekDates(emp.weekStart);
            const dailyRecords = emp.dailyRecords || [];
            
            console.log('Week dates:', weekDates);
            console.log('Daily records array length:', dailyRecords.length);
            
            // Shorten name if too long
            let displayName = emp.name;
            if (displayName.length > 30) {
                displayName = displayName.substring(0, 28) + '..';
            }
            
            // Build attendance cells (7 days + total)
            let attendanceCells = '';
            
            if (dailyRecords.length === 7) {
                console.log('Processing 7 days of records...');
                // Map through all 7 days (Monday to Sunday)
                for (let i = 0; i < 7; i++) {
                    const day = dailyRecords[i];
                    const hours = calculateDayHours(day, i);
                    attendanceCells += `<td style="font-weight: bold; font-size: 8px;">${hours}</td>`;
                }
            } else {
                console.warn('Daily records length is not 7:', dailyRecords.length);
                // No data - show dashes for all 7 days
                for (let i = 0; i < 7; i++) {
                    attendanceCells += '<td style="font-weight: bold; font-size: 8px;">-</td>';
                }
            }
            
            // Add total column
            attendanceCells += `<td style="font-weight: bold; font-size: 8px;">${emp.workingDays || 0}d</td>`;
            
            const attendanceRows = `
                <tr>
                    <td style="text-align: left; font-weight: bold; padding-left: 2mm;">${displayName}</td>
                    ${attendanceCells}
                </tr>
            `;
            
            const caDeduction = caDeductions[emp.name] || 0;
            const grossPay = emp.finalSalary;
            const netPay = grossPay - caDeduction;
            
            const weekStartFormatted = formatFullDate(emp.weekStart);
            const weekEndFormatted = formatFullDate(emp.weekEnd);
            
            return `
                <div class="payslip">
                    <div class="payslip-header">
                        <h1>COLLAB PRINTING AND GRAPHIC DESIGN</h1>
                        <p>377 Manggahan St. Crossing Bayabas Toril Davao City</p>
                        <p>${weekStartFormatted} to ${weekEndFormatted}</p>
                    </div>

                    <div class="payslip-period">WEEKLY PAYSLIP</div>

                    <div class="payslip-employee-info">
                        <div>${displayName}</div>
                        <div>${weekStartFormatted} to ${weekEndFormatted}</div>
                    </div>

                    <table class="attendance-table">
                        <thead>
                            <tr class="header-row">
                                <th style="text-align: left; padding-left: 2mm;">Name</th>
                                <th>MON<br/><span class="time-cell">${formatDate(weekDates[0])}</span></th>
                                <th>TUE<br/><span class="time-cell">${formatDate(weekDates[1])}</span></th>
                                <th>WED<br/><span class="time-cell">${formatDate(weekDates[2])}</span></th>
                                <th>THU<br/><span class="time-cell">${formatDate(weekDates[3])}</span></th>
                                <th>FRI<br/><span class="time-cell">${formatDate(weekDates[4])}</span></th>
                                <th>SAT<br/><span class="time-cell">${formatDate(weekDates[5])}</span></th>
                                <th>SUN<br/><span class="time-cell">${formatDate(weekDates[6])}</span></th>
                                <th>TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${attendanceRows}
                        </tbody>
                    </table>

                    <div class="earnings-section">
                        <div class="earnings-row">
                            <span>Working Days:</span>
                            <span>${emp.workingDays || 0}</span>
                        </div>
                        <div class="earnings-row">
                            <span>Daily Rate:</span>
                            <span>₱${(emp.perDayRate || 0).toFixed(2)}</span>
                        </div>
                        <div class="earnings-row formula">
                            <span>${emp.workingDays || 0} days × ₱${(emp.perDayRate || 0).toFixed(2)}</span>
                            <span>₱${(emp.regularSalary || 0).toFixed(2)}</span>
                        </div>
                        <div class="earnings-row">
                            <span>OT (${(emp.overtimeHours || 0).toFixed(2)} hrs × ₱${(emp.overtimeRate || 0).toFixed(2)}):</span>
                            <span>₱${(emp.overtimeFee || 0).toFixed(2)}</span>
                        </div>
                        <div class="earnings-row total">
                            <span>GROSS PAY:</span>
                            <span>₱${grossPay.toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="deductions-section">
                        <div class="deductions-title">DEDUCTIONS:</div>
                        <div class="earnings-row">
                            <span>CA Deduction:</span>
                            <span>₱${caDeduction.toFixed(2)}</span>
                        </div>
                        <div class="earnings-row formula">
                            <span>₱${grossPay.toFixed(2)} - ₱${caDeduction.toFixed(2)}</span>
                            <span></span>
                        </div>
                        <div class="earnings-row total">
                            <span>NET PAY:</span>
                            <span>₱${netPay.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function getWeekDates(weekStart) {
            if (!weekStart) return [];
            
            const dates = [];
            const startDate = new Date(weekStart);
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                dates.push(date.toISOString().split('T')[0]);
            }
            
            return dates;
        }
    </script>
</body>
</html>
