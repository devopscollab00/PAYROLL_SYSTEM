<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Dashboard - COLLAB Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .controls-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-download {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .personnel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .personnel-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s;
            position: relative;
        }

        .personnel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .personnel-card input[type="checkbox"] {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .personnel-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-right: 40px;
        }

        .personnel-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .salary-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .salary-highlight .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .salary-highlight .amount {
            font-size: 24px;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        /* Print Styles */
        .print-container {
            display: none;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .dashboard-container,
            .header,
            .controls,
            .stats-grid,
            .personnel-grid {
                display: none !important;
            }

            .print-container {
                display: block !important;
            }

            .payslip {
                page-break-after: always;
                padding: 15mm;
                width: 210mm;
                min-height: 148mm;
                margin: 0;
            }

            .payslip:last-child {
                page-break-after: auto;
            }
        }

        .payslip {
            background: white;
            padding: 30px;
            max-width: 210mm;
            margin: 0 auto 30px;
            border: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .payslip-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .payslip-header h1 {
            font-size: 16px;
            margin-bottom: 3px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .payslip-header p {
            font-size: 10px;
            margin: 2px 0;
        }

        .payslip-period {
            text-align: center;
            font-size: 11px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .payslip-employee-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 11px;
        }

        .employee-name-label {
            font-weight: bold;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 9px;
        }

        .attendance-table th,
        .attendance-table td {
            border: 1px solid #000;
            padding: 4px;
            text-align: center;
        }

        .attendance-table th {
            background: #f0f0f0;
            font-weight: bold;
        }

        .attendance-table .header-row th {
            font-size: 8px;
            padding: 3px;
        }

        .attendance-table .time-cell {
            font-size: 8px;
        }

        .earnings-section {
            margin-top: 15px;
            font-size: 10px;
        }

        .earnings-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #ddd;
        }

        .earnings-row.total {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            font-weight: bold;
            margin-top: 8px;
            padding: 6px 0;
            font-size: 11px;
        }

        .deductions-section {
            margin-top: 12px;
            font-size: 10px;
        }

        .deductions-title {
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 5px;
        }

        .calculation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .personnel-grid {
                grid-template-columns: 1fr;
            }

            .controls-row {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        .no-data {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            color: #999;
        }

        .no-data svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>📊 Payroll Dashboard</h1>
            <p>COLLAB Attendance System - Weekly Payroll Management</p>
        </div>

        <div class="controls">
            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search employee name...">
                </div>
                <button class="btn btn-primary" onclick="selectAll()">
                    ✓ Select All
                </button>
                <button class="btn btn-success" onclick="deselectAll()">
                    ✗ Deselect All
                </button>
                <button class="btn btn-download" onclick="downloadPayslips()">
                    📥 Download Selected (PDF)
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <div class="value" id="totalEmployees">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Working Hours</h3>
                <div class="value" id="totalHours">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Payroll</h3>
                <div class="value" id="totalPayroll">₱0</div>
            </div>
            <div class="stat-card">
                <h3>Selected</h3>
                <div class="value" id="selectedCount">0</div>
            </div>
        </div>

        <div id="personnelGrid" class="personnel-grid">
            <div class="loading">Loading payroll data...</div>
        </div>
    </div>

    <!-- Print Container (Hidden, shown only when printing) -->
    <div class="print-container" id="printContainer"></div>

    <script>
        // Configuration - Update this with your deployed web app URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";
        
        let allEmployees = [];
        let filteredEmployees = [];

        // Initialize dashboard
        function initDashboard() {
            // Fetch real data from Google Sheets via Apps Script
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        allEmployees = response.data;
                        filteredEmployees = [...allEmployees];
                        renderEmployees();
                        updateStats();
                    } else {
                        console.error('Error fetching payroll data:', response.message);
                        showError('Failed to load payroll data: ' + response.message);
                        loadSampleData(); // Fallback to sample data
                    }
                })
                .withFailureHandler(function(error) {
                    console.error('Error calling getPayrollData:', error);
                    showError('Failed to connect to server');
                    loadSampleData(); // Fallback to sample data
                })
                .getPayrollData();
        }

        // Fallback to sample data if Google Sheets connection fails
        function loadSampleData() {
            allEmployees = [
                {
                    name: "Ray An Rubio",
                    perDayRate: 666.67,
                    perHourRate: 83.33375,
                    overtimeRate: 108.33387,
                    workingHours: 40.00,
                    workingDays: 5,
                    overtimeHours: 2.50,
                    regularSalary: 3500.00,
                    overtimeFee: 270.83,
                    finalSalary: 3770.83,
                    weekStart: "2026-08-11",
                    weekEnd: "2026-08-17"
                }
            ];
            filteredEmployees = [...allEmployees];
            renderEmployees();
            updateStats();
        }

        // Show error message
        function showError(message) {
            const grid = document.getElementById('personnelGrid');
            grid.innerHTML = `
                <div class="no-data">
                    <h3>Error</h3>
                    <p>${message}</p>
                    <p style="margin-top: 10px;">Loading sample data instead...</p>
                </div>
            `;
        }

        // Render employee cards
        function renderEmployees() {
            const grid = document.getElementById('personnelGrid');
            
            if (filteredEmployees.length === 0) {
                grid.innerHTML = `
                    <div class="no-data">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                        <h3>No employees found</h3>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredEmployees.map((emp, index) => `
                <div class="personnel-card">
                    <input type="checkbox" class="employee-checkbox" data-index="${index}" onchange="updateSelectionCount()">
                    <div class="personnel-name">${emp.name}</div>
                    <div class="personnel-info">
                        <div class="info-item">
                            <span class="info-label">Working Days</span>
                            <span class="info-value">${emp.workingDays || 0} days</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Working Hours</span>
                            <span class="info-value">${emp.workingHours ? emp.workingHours.toFixed(2) : '0.00'} hrs</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Overtime Hours</span>
                            <span class="info-value">${emp.overtimeHours ? emp.overtimeHours.toFixed(2) : '0.00'} hrs</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Per Day Rate</span>
                            <span class="info-value">₱${emp.perDayRate ? emp.perDayRate.toFixed(2) : '0.00'}</span>
                        </div>
                    </div>
                    <div class="salary-highlight">
                        <div class="label">Weekly Salary</div>
                        <div class="amount">₱${emp.finalSalary ? emp.finalSalary.toLocaleString('en-PH', {minimumFractionDigits: 2}) : '0.00'}</div>
                    </div>
                    ${getStatusBadge(emp)}
                </div>
            `).join('');
        }

        // Get status badge
        function getStatusBadge(emp) {
            if (emp.workingDays >= 5) {
                return '<span class="badge badge-success">✓ Full Week</span>';
            } else if (emp.workingDays >= 3) {
                return '<span class="badge badge-warning">⚠ Partial Week</span>';
            } else {
                return '<span class="badge badge-danger">✗ Incomplete</span>';
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalEmployees').textContent = allEmployees.length;
            
            const totalHours = allEmployees.reduce((sum, emp) => sum + (emp.workingHours || 0), 0);
            document.getElementById('totalHours').textContent = totalHours.toFixed(2);
            
            const totalPayroll = allEmployees.reduce((sum, emp) => sum + (emp.finalSalary || 0), 0);
            document.getElementById('totalPayroll').textContent = '₱' + totalPayroll.toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            updateSelectionCount();
        }

        // Update selection count
        function updateSelectionCount() {
            const selected = document.querySelectorAll('.employee-checkbox:checked').length;
            document.getElementById('selectedCount').textContent = selected;
        }

        // Select all employees
        function selectAll() {
            document.querySelectorAll('.employee-checkbox').forEach(cb => cb.checked = true);
            updateSelectionCount();
        }

        // Deselect all employees
        function deselectAll() {
            document.querySelectorAll('.employee-checkbox').forEach(cb => cb.checked = false);
            updateSelectionCount();
        }

        // Search functionality
        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredEmployees = allEmployees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm)
            );
            renderEmployees();
        });

        // Download payslips as PDF
        function downloadPayslips() {
            const checkboxes = document.querySelectorAll('.employee-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('Please select at least one employee to download payslips.');
                return;
            }

            const printContainer = document.getElementById('printContainer');
            printContainer.innerHTML = '<div class="loading" style="color: #333;">Loading attendance data...</div>';

            let processedCount = 0;
            const totalToProcess = checkboxes.length;
            const payslipsHtml = [];

            checkboxes.forEach((checkbox, idx) => {
                const index = parseInt(checkbox.dataset.index);
                const employee = filteredEmployees[index];
                
                // Fetch attendance details for each employee
                google.script.run
                    .withSuccessHandler(function(response) {
                        processedCount++;
                        
                        if (response.success) {
                            employee.dailyRecords = response.dailyRecords;
                        }
                        
                        payslipsHtml.push(generatePayslip(employee));
                        
                        // When all employees are processed, show payslips
                        if (processedCount === totalToProcess) {
                            printContainer.innerHTML = payslipsHtml.join('');
                            setTimeout(() => window.print(), 500);
                        }
                    })
                    .withFailureHandler(function(error) {
                        processedCount++;
                        console.error('Error fetching attendance for ' + employee.name + ':', error);
                        
                        // Generate payslip without daily details
                        payslipsHtml.push(generatePayslip(employee));
                        
                        if (processedCount === totalToProcess) {
                            printContainer.innerHTML = payslipsHtml.join('');
                            setTimeout(() => window.print(), 500);
                        }
                    })
                    .getEmployeeAttendanceDetails(employee.name);
            });
        }

        // Generate individual payslip HTML - Matching image format
        function generatePayslip(emp) {
            // Format dates
            const formatDate = (dateStr) => {
                if (!dateStr) return 'N/A';
                const d = new Date(dateStr);
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[d.getMonth()] + '-' + d.getDate();
            };
            
            // Get week dates
            const weekDates = emp.dates || getWeekDates(emp.weekStart);
            const dailyRecords = emp.dailyRecords || [];
            
            // Generate attendance table rows
            let attendanceRows = '';
            if (dailyRecords.length > 0) {
                attendanceRows = `
                    <tr>
                        <td>*</td>
                        <td style="text-align: left;">${emp.name}</td>
                        <td>RV5</td>
                        ${dailyRecords.map((day, idx) => {
                            if (idx === 6) { // Sunday - Total column
                                return `<td>Total<br/>days<br/>${emp.workingDays || 0}</td>`;
                            }
                            if (day.clockIn === '-' && day.clockOut === '-') {
                                return '<td class="time-cell">-<br/>-</td>';
                            }
                            return `<td class="time-cell">${day.clockIn || '-'}<br/>${day.clockOut || '-'}</td>`;
                        }).join('')}
                    </tr>
                `;
            } else {
                // Fallback if no attendance data
                attendanceRows = `
                    <tr>
                        <td>*</td>
                        <td style="text-align: left;">${emp.name}</td>
                        <td>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td class="time-cell">-<br/>-</td>
                        <td>Total<br/>days<br/>${emp.workingDays || 0}</td>
                    </tr>
                `;
            }
            
            return `
                <div class="payslip">
                    <div class="payslip-header">
                        <h1>COLLAB PRINTING AND GRAPHIC DESIGN</h1>
                        <p>Rosario, Jhon Lloyd Dioso, Tologonon</p>
                        <p>${emp.weekStart || 'N/A'} to ${emp.weekEnd || 'N/A'}</p>
                    </div>

                    <div class="payslip-period">
                        WEEKLY PAYSLIP
                    </div>

                    <div class="payslip-employee-info">
                        <div class="employee-name-label">${emp.name}</div>
                        <div>Period: ${emp.weekStart || 'N/A'}</div>
                    </div>

                    <table class="attendance-table">
                        <thead>
                            <tr class="header-row">
                                <th>*</th>
                                <th>Name</th>
                                <th>OS</th>
                                <th>M<br/><span class="time-cell">${formatDate(weekDates[0])}</span></th>
                                <th>T<br/><span class="time-cell">${formatDate(weekDates[1])}</span></th>
                                <th>W<br/><span class="time-cell">${formatDate(weekDates[2])}</span></th>
                                <th>TH<br/><span class="time-cell">${formatDate(weekDates[3])}</span></th>
                                <th>F<br/><span class="time-cell">${formatDate(weekDates[4])}</span></th>
                                <th>SA<br/><span class="time-cell">${formatDate(weekDates[5])}</span></th>
                                <th>SUN<br/><span class="time-cell">${formatDate(weekDates[6])}</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${attendanceRows}
                            <tr>
                                <td colspan="11" style="text-align: right; font-weight: bold;">OT (hrs): ${emp.overtimeHours ? emp.overtimeHours.toFixed(2) : '0.00'}</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="calculation-grid">
                        <div class="earnings-section">
                            <div class="earnings-row">
                                <span># of days</span>
                                <span>${emp.workingDays || 0}</span>
                            </div>
                            <div class="earnings-row">
                                <span>× ₱${emp.perDayRate ? emp.perDayRate.toFixed(2) : '0.00'}</span>
                                <span>₱${emp.regularSalary ? emp.regularSalary.toFixed(2) : '0.00'}</span>
                            </div>
                            <div class="earnings-row">
                                <span>OT: ${emp.overtimeHours ? emp.overtimeHours.toFixed(2) : '0.00'} hrs × ₱${emp.overtimeRate ? emp.overtimeRate.toFixed(2) : '0.00'}</span>
                                <span>₱${emp.overtimeFee ? emp.overtimeFee.toFixed(2) : '0.00'}</span>
                            </div>
                        </div>

                        <div class="earnings-section">
                            <div class="earnings-row total">
                                <span>TOTAL AMOUNT PAID</span>
                                <span>₱${emp.finalSalary ? emp.finalSalary.toFixed(2) : '0.00'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="deductions-section">
                        <div class="deductions-title">Less Deductions :</div>
                        <div class="earnings-row">
                            <span>CA</span>
                            <span>₱0.00</span>
                        </div>
                        <div class="earnings-row">
                            <span>CA2</span>
                            <span>₱0.00</span>
                        </div>
                        <div class="earnings-row">
                            <span>Other</span>
                            <span>₱0.00</span>
                        </div>
                        <div class="earnings-row total">
                            <span>NET PAY</span>
                            <span>₱${emp.finalSalary ? emp.finalSalary.toFixed(2) : '0.00'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Helper function to get week dates
        function getWeekDates(weekStart) {
            if (!weekStart) return [];
            
            const dates = [];
            const startDate = new Date(weekStart);
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                dates.push(date.toISOString().split('T')[0]);
            }
            
            return dates;
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
